# kind cluster config: maps the API's NodePort (30080) to localhost,
# so http://localhost:30080 works exactly like it would on Docker Desktop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
