# Secrets (API key + DB credentials). These are demo values for local learning -
# in a real cluster you'd create these out-of-band, never commit real ones.
apiVersion: v1
kind: Secret
metadata:
  name: ticketflow-api-secret
type: Opaque
stringData:
  API_KEY: "change-me"
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "ticketflowpw"
  DATABASE_URL: "mysql+pymysql://ticketflow:ticketflowpw@ticketflow-mysql:3306/ticketflow"
