# Stable address for the API, load-balanced across the Pods.
# NodePort makes it reachable at http://localhost:30080 on Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: ticketflow-api
spec:
  type: NodePort
  selector:
    app: ticketflow-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
