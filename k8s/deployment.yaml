# The API itself: 2 replicas, self-healing, with health probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-api
  labels:
    app: ticketflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketflow-api
  template:
    metadata:
      labels:
        app: ticketflow-api
    spec:
      containers:
        - name: ticketflow-api
          image: ticketflow-api:0.1.0
          imagePullPolicy: IfNotPresent     # use the locally built image
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ticketflow-api-config
            - secretRef:
                name: ticketflow-api-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
